let kind='全部';const $=id=>document.getElementById(id);
const translations={"人工智能具身智能投稿推荐": "AI & Embodied Intelligence Publication Guide", "投稿截止：摘要优先；未单列则参考全文截止。下一次日期，已过期按每年相同月日推算，UTC+8 · 中科院：2025 大类分区 · CCF：2026 版": "Deadlines: abstracts first; full papers when no separate abstract deadline is listed. Past dates recur annually as estimates. UTC+8 · CAS: 2025 subject divisions · CCF: 2026", "全部": "All", "会议": "Conferences", "期刊": "Journals", "搜索名称": "Search by name", "资料类型": "Venue type", "CCF 全部": "All CCF ranks", "中科院全部": "All CAS divisions", "未收录": "Unlisted", "1 区": "Division 1", "2 区": "Division 2", "3 区": "Division 3", "4 区": "Division 4", "名称": "Name", "下次投稿截止 · UTC+8": "Next deadline · UTC+8", "投稿倒计时": "Time remaining", "中科院分区": "CAS division", "CCF 等级": "CCF rank", "平均周期": "Average duration", "投稿 → 录用": "Submission → acceptance", "录用率": "Acceptance rate", "没有匹配项": "No matching venues", "没查到": "Not found", "未单列": "Not listed separately", "全文截止": "Full paper deadline", "按往年推算": "Estimated from prior years", "网友估计": "User estimate", "—：不适用；未单列摘要日期时使用全文截止。日期来源：官网 / ": "—: Not applicable. Full paper deadlines are used when abstracts have no separate deadline. Sources: official websites / ", "周期仅收录明确的投稿至录用数据；没查到：未找到符合口径的数据。录用率标明统计年份或网友估计（非官方）；点击数值查看来源。查询：2026-09-16。": "Durations cover submission to acceptance only. “Not found” means no data matching this definition was found. Rates show their year or a non-official user estimate; click a value for its source. Checked: 2026-09-16."};
let language='zh';try{language=localStorage.getItem('venues-language')==='en'?'en':'zh';}catch{}
const t=text=>language==='en'?(translations[text]||text):text;
const daysText=n=>language==='en'?n+' '+(n===1?'day':'days'):n+' 天';
function savePreference(key,value){try{localStorage.setItem(key,value);}catch{}}
function updatePreferences(){
const dark=document.documentElement.dataset.theme==='dark';
$('language-toggle').textContent=language==='zh'?'English':'中文';
$('language-toggle').setAttribute('aria-label',language==='zh'?'Switch to English':'切换为中文');
$('theme-toggle').textContent=dark?(language==='zh'?'☀ 日间模式':'☀ Light mode'):(language==='zh'?'☾ 夜间模式':'☾ Dark mode');
$('theme-toggle').setAttribute('aria-label',language==='zh'?(dark?'切换为日间模式':'切换为夜间模式'):(dark?'Switch to light mode':'Switch to dark mode'));
}
function applyLanguage(){
document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=t('人工智能具身智能投稿推荐');
document.querySelectorAll('[data-i18n]').forEach(el=>{const node=Array.from(el.childNodes).find(n=>n.nodeType===3);if(node)node.textContent=t(el.dataset.i18n);});
$('query').placeholder=t('搜索名称');$('query').setAttribute('aria-label',t('搜索名称'));
$('ccf').setAttribute('aria-label',t('CCF 等级'));$('cas').setAttribute('aria-label',t('中科院分区'));
document.querySelector('nav').setAttribute('aria-label',t('资料类型'));updatePreferences();render();
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function linked(v,text,note=''){return `<a href="${esc(v.source)}" target="_blank" rel="noopener" title="${v.kind==='期刊'?'LetPub':'CCFDDL'}">${esc(text)}</a>${note?`<span class="meta">${esc(note)}</span>`:''}`;}
function nextDeadline(v,now=Date.now()){
if(v.kind!=='会议'||!v.deadline)return null;
const original=Date.parse(v.deadline.replace(' ','T')+'+08:00');
if(!Number.isFinite(original))return null;
if(original>=now)return {time:original,text:v.deadline,estimated:!!v.fallback};
const currentYear=new Date(now+8*3600000).getUTCFullYear();
const month=Number(v.deadline.slice(5,7)),day=Number(v.deadline.slice(8,10));
for(let year=currentYear;year<=currentYear+1;year++){
const validDay=Math.min(day,new Date(Date.UTC(year,month,0)).getUTCDate());
const text=year+'-'+String(month).padStart(2,'0')+'-'+String(validDay).padStart(2,'0')+v.deadline.slice(10);
const time=Date.parse(text.replace(' ','T')+'+08:00');
if(time>=now)return {time,text,estimated:true};
}
}
function deadlineCell(v,now){
const next=nextDeadline(v,now);
if(!next)return '<span class="muted">'+(v.kind==='会议'?t('未单列'):'—')+'</span>';
const date=v.deadlineSource?`<a class="date-source" href="${esc(v.deadlineSource)}" target="_blank" rel="noopener">${esc(next.text)}</a>`:esc(next.text);
const note=[t(v.deadlineType||''),next.estimated?t('按往年推算'):''].filter(Boolean).join(' · ');
return date+(note?'<span class="fallback">'+esc(note)+'</span>':'');
}
function countdown(v,now=Date.now()){
const next=nextDeadline(v,now);
if(!next)return '<span class="muted">—</span>';
return '<span class="countdown">'+(language==='zh'?'剩余 ':'')+daysText(Math.ceil((next.time-now)/86400000))+(language==='en'?' left':'')+'</span>';
}
function render(){
const now=Date.now();
const q=$('query').value.trim().toLowerCase();
const result=venues.filter(v=>(kind==='全部'||v.kind===kind)&&(!$('ccf').value||v.ccf===$('ccf').value)&&(!$('cas').value||v.cas===$('cas').value)&&(!q||(v.code+' '+v.fullName).toLowerCase().includes(q)));
result.sort((a,b)=>a.kind!==b.kind?(a.kind==='会议'?-1:1):a.kind==='会议'?((nextDeadline(a,now)?.time??Infinity)-(nextDeadline(b,now)?.time??Infinity)):0);
$('table').className='mode-'+kind;
$('body').innerHTML=result.map(v=>`<tr><td>${esc(v.code)}${v.fullName!==v.code?`<span class="fullname">${esc(v.fullName)}</span>`:''}</td><td class="date conference-only">${deadlineCell(v,now)}</td><td class="metric conference-only">${countdown(v,now)}</td><td class="journal-only">${esc(t(v.cas))}</td><td><span class="badge ${v.ccf==='未收录'?'':v.ccf}">${esc(t(v.ccf))}</span></td><td class="metric journal-only">${v.kind==='会议'?'<span class="muted">—</span>':v.reviewDays?linked(v,daysText(v.reviewDays)):'<span class="muted">'+t('没查到')+'</span>'}</td><td class="metric">${v.rate?linked(v,language==='en'?v.rate.replace('约 ','~'):v.rate,v.rateYear?String(v.rateYear)+(language==='zh'?' 年':''):t(v.rateKind)):'<span class="muted">'+t('没查到')+'</span>'}</td></tr>`).join('');
$('count').textContent=result.length+(language==='zh'?' 项':result.length===1?' venue':' venues');$('empty').hidden=result.length>0;
}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(kind==='会议')$('cas').value='';$('cas').disabled=kind==='会议';render();}));['query','ccf','cas'].forEach(id=>$(id).addEventListener('input',render));
$('language-toggle').addEventListener('click',()=>{language=language==='zh'?'en':'zh';savePreference('venues-language',language);applyLanguage();});
$('theme-toggle').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;savePreference('venues-theme',theme);updatePreferences();});
applyLanguage();
setInterval(render,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render();});
</script></body></html>
