function nextDeadline(v,now=Date.now()){

const time=Date.parse(text.replace(' ','T')+'+08:00');

}
}

}

result.sort((a,b)=>a.kind!==b.kind?(a.kind==='会议'?-1:1):a.kind==='会议'?((nextDeadline(a,now)?.time??Infinity)-(nextDeadline(b,now)?.time??Infinity)):0);
$('table').className='mode-'+kind;
$('body').innerHTML=result.map(v=>`<tr><td>${esc(v.code)}${v.fullName!==v.code?`<span class="fullname">${esc(v.fullName)}</span>`:''}</td><td class="date conference-only">${deadlineCell(v,now)}</td><td class="metric conference-only">${countdown(v,now)}</td><td class="journal-only">${esc(v.cas)}</td><td><span class="badge ${v.ccf==='未收录'?'':v.ccf}">${esc(v.ccf)}</span></td><td class="metric journal-only">${v.kind==='会议'?'<span class="muted">—</span>':v.reviewDays?linked(v,v.reviewDays+' 天'):'<span class="muted">没查到</span>'}</td><td class="metric">${v.rate?linked(v,v.rate,v.rateYear?v.rateYear+' 年':v.rateKind):'<span class="muted">没查到</span>'}</td></tr>`).join('');
$('count').textContent=result.length+' 项';$('empty').hidden=result.length>0;
}
document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(kind==='会议')$('cas').value='';$('cas').disabled=kind==='会议';render();}));['query','ccf','cas'].forEach(id=>$(id).addEventListener('input',render));render();
setInterval(render,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render();});
</script></body></html>
